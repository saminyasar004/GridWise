services:
  gridwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridwise:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3000/health']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'